name: Autograding Tests

'on':
  repository_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: assignment 6 test
        id: assignment-6-test
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: assignment 6 test
          setup-command: ''
          command: make test
          timeout: 3
          max-score: 100
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          ASSIGNMENT-6-TEST_RESULTS: "${{steps.assignment-6-test.outputs.result}}"
        with:
          runners: assignment-6-test